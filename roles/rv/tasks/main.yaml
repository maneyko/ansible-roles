---
- name: Create rv group
  group:
    name: rv

- name: Add users to rv group
  loop: "{{ rv_users }}"
  user:
    name: "{{ item }}"
    groups: rv
    append: true

# o= on rv_home is deliberate: with the real binary inside it, rv is unusable
# by anyone outside the rv group, rather than usable but unable to write the
# rubies. Group-writable because gems are installed into the ruby it belongs to.
- name: Create rv directories
  loop:
    - "{{ rv_home }}"
    - "{{ rv_home }}/rubies"
    - "{{ rv_home }}/libexec/bin"
  file:
    state: directory
    path:  "{{ item }}"
    mode:  'g+srw,o='
    group: rv

- name: Install rv binary
  include_role:
    name: maneyko.roles.github_install_binary
  vars:
    github_install_binary_repo:   spinel-coop/rv
    github_install_binary_exec:   rv
    github_install_binary_dest:   "{{ rv_home }}/libexec/bin"
    github_install_binary_filter: startswith("rv-\($uname_m)-") and endswith("linux-gnu.tar.xz")
    github_install_binary_find:   find */{rv,rvx}

# The only thing on PATH, for the same reasons as the uv shim. RUBIES_PATH is
# the one variable rv actually reads -- the RV_INSTALL_PATH and RV_CACHE_DIR
# this replaces were never consulted, and only --install-dir was holding the
# shared location together.
- name: Install rv shims
  loop: [rv, rvx]
  copy:
    dest: /usr/local/bin/{{ item }}
    mode: '0755'
    content: |
      #!/bin/sh
      umask 0002
      export RUBIES_PATH={{ rv_home }}/rubies
      exec {{ rv_home }}/libexec/bin/{{ item }} "$@"

- name: Remove the rv profile
  file:
    path: /etc/profile.d/rv.sh
    state: absent

- name: Install rv Ruby
  command:
    creates: "{{ rv_home }}/rubies/*"
    cmd: rv ruby install

- name: Find installed rubies
  register: rv_rubies
  find:
    paths:     "{{ rv_home }}/rubies"
    file_type: directory
    recurse:   false

# The sweep below cannot reach gems installed later: RubyGems chmods each file
# it extracts to the mode in the gem's tar header (Gem::Package#extract_tar_gz)
# and creates gem directories with the caller's umask, which this role does not
# set -- bundle runs off PATH, not through the rv shim. site_ruby is on every
# Ruby's default $LOAD_PATH, where Gem.load_env_plugins finds the hook for both
# `gem` and `bundle`, with no version in the path and no variable to export.
- name: Create rv Ruby site directories
  loop: "{{ rv_rubies.files | map(attribute='path') | sort }}"
  file:
    state: directory
    path:  "{{ item }}/lib/ruby/site_ruby"

- name: Install the RubyGems group-access hook
  loop: "{{ rv_rubies.files | map(attribute='path') | sort }}"
  copy:
    src:  rubygems_plugin.rb
    dest: "{{ item }}/lib/ruby/site_ruby/rubygems_plugin.rb"

# rv extracts the tarball as root, so the interpreter arrives root:root 0755 and
# no group member can install a gem into it. Directories become group-writable
# and setgid, which is enough to create, replace and delete gems; the shipped
# files stay read-only, so sharing a ruby does not mean sharing the ability to
# rewrite its stdlib. Gem files are the exception: the hook above keeps them
# group-writable, so a gem can be repaired in place and not only replaced.
- name: Make installed rubies group-writable
  changed_when: false
  shell: |
    chgrp -R rv {{ rv_home }}/rubies
    find {{ rv_home }}/rubies -type d -exec chmod g+rwxs {} +
    find {{ rv_home }}/rubies -type f -exec chmod g+r {} +

- name: Link rv rubies directory
  file:
    src:   "{{ rv_home }}/rubies"
    dest:  "{{ rv_rubies_link }}"
    state: link
