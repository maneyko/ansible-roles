---
- name: Install baresip build dependencies
  apt:
    update_cache: true
    pkg:
      - git
      - build-essential
      - cmake
      - libssl-dev
      - pkg-config
      - zlib1g-dev

- name: Install baresip runtime dependencies
  apt:
    update_cache: true
    pkg:
      - libmosquitto-dev
      - mosquitto-clients
      - mosquitto

- name: Enable mosquitto service
  systemd_service:
    name: mosquitto
    enabled: true
    state: started

# Built from source: Debian's baresip is too old to carry the mqtt module.
- name: Build baresip
  script:
    creates: /usr/local/bin/baresip
    cmd: install-baresip.sh

- name: Create baresip user
  user:
    name: baresip
    create_home: false
    system: true
    shell: /usr/sbin/nologin

- name: Create baresip config directory
  file:
    state: directory
    path: /etc/baresip
    mode: '0755'

- name: Install baresip config
  loop: [config, contacts]
  copy:
    src:  "{{ item }}"
    dest: /etc/baresip/{{ item }}
    mode: '0644'

# SIP passwords: readable by the service, by nobody else.
- name: Install baresip accounts
  no_log: true
  copy:
    content: "{{ baresip_accounts }}"
    dest:  /etc/baresip/accounts
    group: baresip
    mode:  '0640'

- name: Install baresip unit
  copy:
    src:  baresip.service
    dest: /etc/systemd/system/baresip.service
    mode: '0644'

- name: Enable baresip service
  systemd_service:
    name: baresip
    daemon_reload: true
    enabled: true
    state: started
