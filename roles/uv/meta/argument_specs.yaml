---
argument_specs:
  main:
    short_description: Install uv and a shared Python toolchain under {{ uv_home }}
    options:
      uv_users:
        type: list
        elements: str
        default: []
        description: >-
          Users added to the uv group. Membership is required to run uv at all,
          not just to write the cache: the binary lives inside uv_home.
      uv_home:
        type: path
        default: /opt/uv
        description: >-
          Group-writable root for the uv binary, its cache and its Pythons.
          /usr/local/bin/uv is a shim that points every caller here.
