---
argument_specs:
  main:
    short_description: Install uv and a shared Python toolchain under {{ uv_home }}
    options:
      uv_users:
        type: list
        elements: str
        default: []
        description: Users added to the uv group, granting write access to uv_home.
      uv_home:
        type: path
        default: /opt/uv
        description: Group-writable root for the uv cache and installed Pythons.
