---
- name: Create uv group
  group:
    name: uv

- name: Add users to uv group
  loop: "{{ uv_users }}"
  user:
    name: "{{ item }}"
    groups: uv
    append: true

# o= on uv_home is deliberate: with the real binary inside it, uv is unusable
# by anyone outside the uv group, rather than usable but unable to write the
# cache. Group-writable because a shared cache has many writers.
- name: Create uv directories
  loop:
    - "{{ uv_home }}"
    - "{{ uv_home }}/cache"
    - "{{ uv_home }}/python"
    - "{{ uv_home }}/py-bin"
    - "{{ uv_home }}/libexec/bin"
  file:
    state: directory
    path:  "{{ item }}"
    mode:  'g+srw,o='
    group: uv

- name: Install uv binary
  include_role:
    name: maneyko.roles.github_install_binary
  vars:
    github_install_binary_repo:   astral-sh/uv
    github_install_binary_exec:   uv
    github_install_binary_dest:   "{{ uv_home }}/libexec/bin"
    github_install_binary_filter: startswith("uv-\($uname_m)-") and endswith("linux-gnu.tar.gz")
    github_install_binary_find:   find */{uv,uvx}

# The only thing on PATH. Every caller -- login shell, systemd unit, this role
# -- gets the shared toolchain and a umask that keeps the cache writable by the
# group, without any of them naming a UV_ variable. Ansible cannot rely on the
# equivalent shell function: exports survive into a module's subprocess, shell
# functions do not, which is how the cache came to be group-readable only.
#
# UV_LINK_MODE=copy because uv hardlinks cache entries into venvs by default,
# and a hardlink's owner and mode *are* the cache entry's. An app that hands its
# own checkout to its own group -- pyapp does, and its .venv sits inside that
# checkout -- rewrites the shared entries out from under every other member of
# this group. A shared cache and per-app venv ownership cannot both have the
# same inode; copies cost tens of MB and end the argument.
- name: Install uv shims
  loop: [uv, uvx]
  copy:
    dest: /usr/local/bin/{{ item }}
    mode: '0755'
    content: |
      #!/bin/sh
      umask 0002
      export UV_CACHE_DIR={{ uv_home }}/cache
      export UV_PYTHON_INSTALL_DIR={{ uv_home }}/python
      export UV_PYTHON_BIN_DIR={{ uv_home }}/py-bin
      export UV_LINK_MODE=copy
      exec {{ uv_home }}/libexec/bin/{{ item }} "$@"

# Superseded by the shim, which every caller reaches without sourcing anything.
- name: Remove the uv profile
  file:
    path: /etc/profile.d/uv.sh
    state: absent

- name: Install uv Python
  command:
    creates: "{{ uv_home }}/python/*"
    cmd: uv python install
