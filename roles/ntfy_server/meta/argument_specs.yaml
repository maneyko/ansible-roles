---
argument_specs:
  main:
    short_description: Run ntfy behind NGINX as a pub-sub notification server
    description: >-
      Serves TLS from ntfy_server_cert_snippet, which must already exist and
      must cover ntfy_server_domain. maneyko.roles.nginx_common writes the
      default one, but any certificate source will do.
    options:
      ntfy_server_domain:
        type: str
        required: true
        description: Public hostname. Drives both the NGINX server_name and ntfy's base-url.
      ntfy_server_local_conf:
        type: str
        required: true
        no_log: true
        description: >-
          NGINX snippet included by the publish-only server block, kept out of
          the repo because it names a private host.
      ntfy_server_listen:
        type: str
        default: 127.0.0.1:2586
        description: Address ntfy listens on, and the NGINX proxy_pass target.
      ntfy_server_upstream:
        type: str
        default: https://ntfy.sh
        description: Upstream ntfy instance used to forward iOS push notifications.
      ntfy_server_cert_snippet:
        type: str
        default: snippets/default-cert.conf
        description: >-
          NGINX include carrying the certificate for both server blocks,
          resolved as NGINX resolves it -- relative to /etc/nginx, or absolute.
