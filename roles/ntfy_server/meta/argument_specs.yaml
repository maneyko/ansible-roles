---
argument_specs:
  main:
    short_description: Run ntfy behind NGINX as a pub-sub notification server
    description: >-
      Serves TLS from snippets/default-cert.conf, so maneyko.roles.nginx_common
      must have run and its certificate must cover ntfy_server_domain.
    options:
      ntfy_server_domain:
        type: str
        required: true
        description: Public hostname. Drives both the NGINX server_name and ntfy's base-url.
      ntfy_server_local_conf:
        type: str
        required: true
        no_log: true
        description: >-
          NGINX snippet included by the publish-only server block, kept out of
          the repo because it names a private host.
      ntfy_server_listen:
        type: str
        default: 127.0.0.1:2586
        description: Address ntfy listens on, and the NGINX proxy_pass target.
      ntfy_server_upstream:
        type: str
        default: https://ntfy.sh
        description: Upstream ntfy instance used to forward iOS push notifications.
