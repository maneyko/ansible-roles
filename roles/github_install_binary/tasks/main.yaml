---
- name: Upload GitHub release downloader
  copy:
    src:  github-download-release.sh
    dest: /usr/local/bin/github-download-release.sh
    mode: '0755'

# No mode: this only asserts the directory exists. uv and rv pass a dest they
# created g+srw,o= themselves, and setting one here would fight them every run.
- name: Create the install directory for {{ github_install_binary_repo }}
  file: # noqa: risky-file-permissions
    state: directory
    path:  "{{ github_install_binary_dest }}"

# The jq filter goes over stdin, not argv: the inventory's `sudo --login`
# adds a second shell expansion pass that strips quoting and eats $uname_m.
- name: Pull {{ github_install_binary_repo }}
  command:
    creates: "{{ github_install_binary_dest }}/{{ github_install_binary_exec }}"
    cmd: github-download-release.sh {{ github_install_binary_repo }} {{ github_install_binary_version }}
    stdin: "{{ github_install_binary_filter }}"
  register: github_install_binary_download

- name: Install {{ github_install_binary_repo }}
  when: github_install_binary_download is not skipped
  # No pipefail: a _find ending in `head -1`, as lego's does, leaves the find
  # itself dead of SIGPIPE, which pipefail would report as a failed install.
  shell: # noqa: risky-shell-pipe
    creates: "{{ github_install_binary_dest }}/{{ github_install_binary_exec }}"
    cmd: |
      f="{{ github_install_binary_download.stdout }}"
      cd "$(dirname "$f")"
      {{ github_install_binary_extract }} "$f"
      {{ github_install_binary_find }} | while read line; do
        mv "$line" {{ github_install_binary_dest }}/
      done
      {{ github_install_binary_extra_cmd }}

- name: Remove the build artifacts for {{ github_install_binary_repo }}
  when: github_install_binary_download is not skipped
  file:
    path: "{{ github_install_binary_download.stdout | ansible.builtin.dirname }}"
    state: absent
