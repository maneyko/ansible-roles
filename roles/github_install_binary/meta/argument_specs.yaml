---
argument_specs:
  main:
    short_description: Install a binary from a GitHub release tarball
    options:
      github_install_binary_repo:
        type: str
        required: true
        description: GitHub repo as owner/name, e.g. astral-sh/uv

      github_install_binary_exec:
        type: str
        required: true
        description: >-
          Name of the installed binary. Doubles as the idempotency marker: the
          role does nothing if <dest>/<exec> already exists, so a wrapper
          installed elsewhere never masks a missing or outdated binary.

      github_install_binary_dest:
        type: path
        default: /usr/local/bin
        description: Directory the binaries are moved into. Created if missing.

      github_install_binary_filter:
        type: str
        required: true
        description: >-
          jq boolean expression selecting the release asset, evaluated against
          .name with $deb_arch and $uname_m in scope.

      github_install_binary_find:
        type: str
        required: true
        description: >-
          Shell command run inside the unpacked archive, printing one path per
          line. Each is moved into github_install_binary_dest.

      github_install_binary_version:
        type: str
        default: latest
        description: Release tag, or "latest".

      github_install_binary_extract:
        type: str
        default: tar -vxf
        description: Extraction command, given the archive path as final argument.

      github_install_binary_extra_cmd:
        type: str
        default: 'true'
        description: Shell run after installation, inside the unpacked archive.
