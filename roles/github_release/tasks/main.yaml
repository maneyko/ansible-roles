---
- name: Upload GitHub release downloader
  copy:
    src:  github-download-release.sh
    dest: /usr/local/bin/github-download-release.sh
    mode: '0755'

# The jq filter goes over stdin, not argv: the inventory's `sudo --login`
# adds a second shell expansion pass that strips quoting and eats $uname_m.
- name: Pull {{ github_release_repo }}
  command:
    creates: /usr/local/bin/{{ github_release_exec }}
    cmd: github-download-release.sh {{ github_release_repo }} {{ github_release_version }}
    stdin: "{{ github_release_filter }}"
  register: github_release_download

- name: Install {{ github_release_repo }}
  when: github_release_download is not skipped
  shell:
    creates: /usr/local/bin/{{ github_release_exec }}
    cmd: |
      f="{{ github_release_download.stdout }}"
      cd "$(dirname "$f")"
      {{ github_release_extract }} "$f"
      {{ github_release_find }} | while read line; do
        mv "$line" /usr/local/bin/
      done
      {{ github_release_extra_cmd }}

- name: Remove {{ github_release_repo }} artifacts
  when: github_release_download is not skipped
  file:
    path: "{{ github_release_download.stdout | ansible.builtin.dirname }}"
    state: absent
